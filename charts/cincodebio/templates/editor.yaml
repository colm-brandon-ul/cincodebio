{{- if .Values.editor.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.editor.name }}
  name: {{ .Values.editor.name }}
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
    - name: files
      port: 3003
      protocol: TCP
      targetPort: 3003
    - name: glsp
      port: 5007
      protocol: TCP
      targetPort: 5007
  selector:
    app: {{ .Values.editor.name }}
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.editor.name }}
  labels:
    app: {{ .Values.editor.name }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Values.editor.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.editor.name }}
    spec:
      {{- if .Values.editor.languageArchiveConfigMap.enabled }}
      initContainers:
        - name: install-cinco-de-bio-language
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /language && tar -xzf /archive/{{ .Values.editor.languageArchiveConfigMap.key }} -C /language
          volumeMounts:
            - name: editor-language-archive
              mountPath: /archive
              readOnly: true
            - name: editor-language
              mountPath: /language
      {{- end }}
      containers:
        - name: {{ .Values.editor.name }}
          image: {{ .Values.editor.image }}
          imagePullPolicy: {{ .Values.editor.imagePullPolicy }}
          {{- if .Values.editor.installProcpsOnStartup }}
          command:
            - /bin/bash
            - -lc
            - |
              if ! command -v ps >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y --no-install-recommends procps
                rm -rf /var/lib/apt/lists/*
              fi
              cd minio-client && node bundle/cinco-minio-client.js --metaFolder ../cinco-glsp-server/languages && \
                cd ../ && cd /editor/browser-app && \
                CINCO_CLOUD_HOST="${CINCO_CLOUD_HOST}" CINCO_CLOUD_PORT="${CINCO_CLOUD_PORT}" \
                MINIO_HOST="${MINIO_HOST}" MINIO_PORT="${MINIO_PORT}" MINIO_ACCESS_KEY="${MINIO_ACCESS_KEY}" MINIO_SECRET_KEY="${MINIO_SECRET_KEY}" \
                THEIA_WEBVIEW_EXTERNAL_ENDPOINT="${THEIA_WEBVIEW_EXTERNAL_ENDPOINT}" THEIA_WEBVIEW_ENDPOINT_PATTERN="${THEIA_WEBVIEW_ENDPOINT_PATTERN}" THEIA_MINI_BROWSER_HOST_PATTERN="${THEIA_MINI_BROWSER_HOST_PATTERN}" \
                INTERNAL_USE_SSL="${INTERNAL_USE_SSL}" EXTERNAL_USE_SSL="${EXTERNAL_USE_SSL}" \
                WORKSPACE_PATH="${WORKSPACE_PATH}" TRANSPILATION_MODE="${TRANSPILATION_MODE}" EDITOR_TYPE="${EDITOR_TYPE}" ENVIRONMENT="${ENVIRONMENT}" \
                yarn run theia start --port=3000 --CINCO_GLSP=5007 -WEB_SERVER_PORT=3003 --remote-debugging-port=9222 --no-cluster --loglevel=warn \
                --root-dir=/editor/workspace --plugins=local-dir:./plugins --hostname 0.0.0.0 \
                --META_DEV_MODE --META_LANGUAGES_FOLDER="${META_LANGUAGES_FOLDER}" --CLIENT_PATH="/editor/cinco-glsp-standalone/app/diagram.html" --META_DEBUG_PORT 9222 \
                "${WORKSPACE_PATH:-/workspace}"
          {{- end }}
          ports:
            - containerPort: 3000
            - containerPort: 3003
            - containerPort: 5007
              {{- if .Values.editor.hostPorts.enabled }}
              hostPort: {{ .Values.editor.hostPorts.glsp }}
              {{- end }}
          env:
            - name: WORKSPACE_PATH
              value: /workspace
            - name: META_LANGUAGES_FOLDER
              value: workspace/languages
            - name: EDITOR_TYPE
              value: LANGUAGE_EDITOR
            - name: USE_SSL
              value: "false"
            - name: CINCO_ALLOWED_ORIGINS
              value: '["localhost", "0.0.0.0", "{{ .Values.hostname }}"]'
            # The GLSP diagram websocket is proxied through the ingress (see WEBSOCKET_HOST_MAPPING
            # + editor-glsp-ingress), so the Origin seen by the GLSP server is the browser origin
            # (http://localhost). Allow any origin for the local deployment to avoid ws rejection.
            - name: CINCO_ALLOW_ANY_ORIGIN
              value: "true"
            # Always use in-cluster Kubernetes service DNS for server-side API calls
            - name: CINCODEBIO_API_BASE_URL
              value: http://{{ .Values.hostname }}
            - name: CINCODEBIO_SIB_MANAGER_BASE_URL
              value: http://{{ .Values.sibManager.name }}
            - name: CINCODEBIO_EXECUTION_API_BASE_URL
              value: http://{{ .Values.executionApi.name }}
            - name: WEBSERVER_HOST_MAPPING
              value: {{ .Values.global.ingress_paths.editor_files_ingress_path }}
            # Route the GLSP diagram websocket through the ingress (port 80) instead of :5007, so
            # the diagram loads on minikube (only the ingress is reachable via the tunnel) and on
            # k3s alike. The client connects to ws://<host>/<mapping>/cinco-diagram.
            - name: WEBSOCKET_HOST_MAPPING
              value: {{ .Values.global.ingress_paths.editor_glsp_ingress_path }}
          {{- if .Values.editor.languageArchiveConfigMap.enabled }}
          volumeMounts:
            - name: editor-language
              mountPath: /editor/workspace/languages
          {{- end }}
      {{- if .Values.editor.languageArchiveConfigMap.enabled }}
      volumes:
        - name: editor-language-archive
          configMap:
            name: {{ .Values.editor.languageArchiveConfigMap.name }}
        - name: editor-language
          emptyDir: {}
      {{- end }}
{{- end }}